<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c1828">
<title>스도쿠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/school-shell.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../assets/no-select.css">
<script src="../assets/mobile-hardening.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="back-btn" href="../">목록</a>
    <h1 class="title">스도쿠</h1>
    <div class="top-actions">
      <button id="btn-help" class="icon-btn" type="button">?</button>
      <button id="btn-sound" class="icon-btn" type="button" aria-label="소리">
        <svg class="ico-on" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="ico-off" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-new" class="icon-btn" type="button">↻</button>
    </div>
  </header>
  <div class="stat-bar">
    <span class="chip"><span class="chip-label">시간</span><span id="timer">0:00</span></span>
    <span class="chip"><span class="chip-label">최고</span><span id="best">–</span></span>
    <div class="mode-toggle" role="group">
      <button type="button" class="mode-btn is-active" data-diff="easy">초급</button>
      <button type="button" class="mode-btn" data-diff="medium">중급</button>
      <button type="button" class="mode-btn" data-diff="hard">고급</button>
    </div>
  </div>
  <main class="stage">
    <div id="grid" class="grid" aria-label="스도쿠"></div>
    <div class="pad">
      <button type="button" class="num" data-n="1">1</button>
      <button type="button" class="num" data-n="2">2</button>
      <button type="button" class="num" data-n="3">3</button>
      <button type="button" class="num" data-n="4">4</button>
      <button type="button" class="num" data-n="5">5</button>
      <button type="button" class="num" data-n="6">6</button>
      <button type="button" class="num" data-n="7">7</button>
      <button type="button" class="num" data-n="8">8</button>
      <button type="button" class="num" data-n="9">9</button>
      <button type="button" class="num erase" data-n="0">지우기</button>
      <button type="button" class="num note-btn" id="btn-note">메모</button>
      <button type="button" class="num hint-btn" id="btn-hint">힌트</button>
    </div>
  </main>
  <div id="overlay" class="overlay" hidden><div class="overlay-card" id="overlay-card"></div></div>
  <div id="help-overlay" class="overlay" hidden>
    <div class="overlay-card help-card">
      <h2>게임 설명서</h2>
      <p class="help-lead">가로·세로·3×3 칸에 <strong>1~9가 한 번씩</strong> 들어가게 채우세요.</p>
      <section class="help-ex"><div class="help-badge">✏️ 메모</div><p class="help-note">메모 모드를 켜면 후보 숫자를 작게 적어둘 수 있어요. 힌트는 빈 칸 하나를 맞춰 줍니다.</p></section>
      <button type="button" class="retry" id="btn-help-close">알겠어요</button>
    </div>
  </div>
</div>
<script src="../assets/sfx-bank.js"></script>
<script src="game.js"></script>
</body>
</html>
