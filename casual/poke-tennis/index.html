<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7ec8ea">
<title>포켓몬 테니스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../assets/no-select.css">
<script src="../assets/mobile-hardening.js"></script>
</head>
<body data-mh-fs-pos="tr">
<div id="app">
  <header class="topbar">
    <a class="back-btn" href="../" aria-label="목록으로">목록</a>
    <div class="score-bar">
      <span class="chip chip-you">
        <span class="chip-label">나</span>
        <span id="score-you">0</span>
      </span>
      <span class="chip chip-mid">
        <span class="chip-label">선승</span>
        <span>5</span>
      </span>
      <span class="chip chip-cpu">
        <span class="chip-label">상대</span>
        <span id="score-cpu">0</span>
      </span>
    </div>
    <button id="btn-sound" class="icon-btn" type="button" aria-label="소리">
      <svg class="ico-on" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
        <path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg class="ico-off" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
        <path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <main class="stage-wrap">
    <div id="court-bg" class="court-bg" aria-hidden="true">
      <img class="pokeball-deco deco-a" src="assets/pokeball.png" alt="" draggable="false" />
      <img class="pokeball-deco deco-b" src="assets/pokeball.png" alt="" draggable="false" />
    </div>
    <canvas id="game-canvas"></canvas>
    <img id="sprite-you" class="poke poke-you" src="assets/poke-you.gif" alt="" draggable="false" />
    <img id="sprite-cpu" class="poke poke-cpu" src="assets/poke-cpu.gif" alt="" draggable="false" />
    <div id="overlay" class="overlay">
      <div class="overlay-card" id="overlay-card"></div>
    </div>
  </main>

  <footer class="hint">드래그하는 동안 래킷이 계속 휘두름 · 5점 선승</footer>
</div>
<script src="../assets/sfx-bank.js"></script>
<script src="game.js"></script>
</body>
</html>
