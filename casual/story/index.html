<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fdeef2">
<title>공주 이야기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../assets/no-select.css">
<script src="../assets/mobile-hardening.js"></script>
</head>
<body>
<div id="app">

  <header class="topbar">
    <a class="back-btn" href="../" aria-label="목록으로">목록</a>
    <h1 class="topbar-title">공주 이야기</h1>
    <button id="btn-sound" type="button" class="icon-btn" aria-label="소리 켜기/끄기" aria-pressed="true">
      <svg class="ico-on" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
        <path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg class="ico-off" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
        <path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <!-- Title screen -->
  <section id="screen-title" class="screen screen-title">
    <div class="title-sky" aria-hidden="true">
      <span class="cloud cloud-a"></span>
      <span class="cloud cloud-b"></span>
      <span class="cloud cloud-c"></span>
      <span class="twinkle t1"></span>
      <span class="twinkle t2"></span>
      <span class="twinkle t3"></span>
      <span class="twinkle t4"></span>
    </div>
    <div class="title-card">
      <p class="eyebrow">파스텔 성에서 보내는 하루</p>
      <h2 class="game-title">공주 이야기<br><span class="sub">별빛 정원의 하루</span></h2>
      <p class="game-desc">아라 공주가 되어 특별한 하루를 보내요.<br>선택에 따라 서로 다른 결말을 만날 수 있어요.</p>
      <button id="btn-start" type="button" class="btn-primary">이야기 시작하기</button>
      <div class="endings-progress" aria-live="polite">
        <p class="endings-label">모은 결말 <span id="endings-count">0</span> / 3</p>
        <div class="endings-dots" id="endings-dots" aria-hidden="true">
          <span class="ending-dot" data-ending="ball"></span>
          <span class="ending-dot" data-ending="heart"></span>
          <span class="ending-dot" data-ending="wander"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- Story / game screen -->
  <section id="screen-game" class="screen screen-game hidden">
    <div id="scene-bg" class="scene-bg">
      <img id="scene-bg-img" class="scene-bg-img" alt="" hidden>
      <div class="scene-deco" aria-hidden="true"></div>
    </div>

    <div class="story-stage">
      <div class="portrait-wrap">
        <div class="portrait-frame">
          <img id="portrait-img" class="portrait-img" alt="">
        </div>
      </div>

      <div class="dialog-box" id="dialog-box">
        <p class="speaker-name" id="speaker-name">아라 공주</p>
        <p class="dialog-text" id="dialog-text"></p>
        <span class="tap-hint" id="tap-hint" aria-hidden="true">▾</span>
      </div>

      <div class="choices" id="choices" aria-live="polite"></div>
    </div>
  </section>

  <!-- Ending screen -->
  <section id="screen-ending" class="screen screen-ending hidden">
    <div id="ending-bg" class="scene-bg">
      <img id="ending-bg-img" class="scene-bg-img" alt="" hidden>
      <div class="scene-deco" aria-hidden="true"></div>
    </div>
    <div class="ending-card">
      <p class="ending-eyebrow">엔딩</p>
      <h2 class="ending-title" id="ending-title">엔딩 제목</h2>
      <p class="ending-text" id="ending-text">엔딩 설명</p>
      <div class="ending-flags" id="ending-flags"></div>
      <div class="ending-actions">
        <button id="btn-replay" type="button" class="btn-primary">다시 도전하기</button>
        <button id="btn-title" type="button" class="btn-secondary">타이틀로</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script src="../assets/sfx-bank.js"></script>
<script src="game.js"></script>
</body>
</html>
