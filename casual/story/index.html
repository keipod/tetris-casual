<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fdeef2">
<title>공주 육성 — 별빛 성의 아라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../assets/no-select.css">
<script src="../assets/mobile-hardening.js"></script>
</head>
<body>
<div id="app">

  <header class="topbar">
    <a class="back-btn" href="../" aria-label="목록으로">목록</a>
    <h1 class="topbar-title">공주 육성</h1>
    <button id="btn-sound" type="button" class="icon-btn" aria-label="소리 켜기/끄기" aria-pressed="true">
      <svg class="ico-on" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
        <path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg class="ico-off" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
        <path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <!-- Title -->
  <section id="screen-title" class="screen screen-title">
    <div class="title-hero" aria-hidden="true">
      <img class="title-cover-img" alt="" src="assets/bg/castle.png">
      <div class="title-hero-shade"></div>
    </div>
    <div class="title-card">
      <p class="eyebrow">Princess Maker inspired</p>
      <h2 class="game-title">별빛 성의 아라<br><span class="sub">공주를 키우는 하루하루</span></h2>
      <p class="game-desc">수업·알바·탐험·휴식·반려동물로 아라를 키워요.<br>가을 축제와 사건들이 운명을 갈라놓아요.</p>
      <button id="btn-new" type="button" class="btn-primary">새 육성 시작</button>
      <button id="btn-continue" type="button" class="btn-secondary hidden">이어하기</button>
    </div>
  </section>

  <!-- Hub -->
  <section id="screen-hub" class="screen screen-hub hidden">
    <div class="hub-hero">
      <img id="hub-bg" class="hub-bg" src="assets/bg/castle.png" alt="">
      <div class="hub-veil"></div>
      <div class="hub-portrait-wrap">
        <img id="hub-portrait" class="hub-portrait" src="assets/portraits/princess1.jpg" alt="아라">
      </div>
    </div>
    <div class="hub-meta">
      <div class="hub-name-row">
        <strong id="hub-name">아라</strong>
        <span id="hub-age">10세</span>
        <span id="hub-season" class="chip">봄</span>
      </div>
      <div class="hub-bars">
        <div class="bar"><span>금화</span><b id="hub-gold">0</b></div>
        <div class="bar"><span>스트레스</span><div class="meter"><i id="meter-stress"></i></div></div>
        <div class="bar"><span>체력</span><div class="meter mint"><i id="meter-stamina"></i></div></div>
      </div>
      <div id="hub-status" class="hub-status"></div>
    </div>
    <div class="hub-actions">
      <button type="button" class="hub-btn" data-go="schedule">스케줄</button>
      <button type="button" class="hub-btn" data-go="stats">스탯</button>
      <button type="button" class="hub-btn" data-go="talk">대화</button>
      <button type="button" class="hub-btn ghost" data-go="title">타이틀</button>
    </div>
  </section>

  <!-- Stats -->
  <section id="screen-stats" class="screen screen-panel hidden">
    <div class="panel-card">
      <div class="panel-head">
        <h2>스탯</h2>
        <button type="button" class="btn-text" data-go="hub">닫기</button>
      </div>
      <div id="stats-grid" class="stats-grid"></div>
    </div>
  </section>

  <!-- Talk -->
  <section id="screen-talk" class="screen screen-panel hidden">
    <div class="panel-card">
      <div class="panel-head">
        <h2>대화</h2>
        <button type="button" class="btn-text" data-go="hub">닫기</button>
      </div>
      <p class="panel-desc">아라와 짧게 마음을 나눠요.</p>
      <button id="btn-talk-chat" type="button" class="btn-primary">다정히 이야기하기</button>
      <button id="btn-talk-money" type="button" class="btn-secondary">용돈 주기 (20G)</button>
      <button id="btn-talk-scold" type="button" class="btn-secondary">타이르기</button>
      <p id="talk-result" class="talk-result"></p>
    </div>
  </section>

  <!-- Schedule -->
  <section id="screen-schedule" class="screen screen-panel hidden">
    <div class="panel-card schedule-card">
      <div class="panel-head">
        <h2>스케줄 · <span id="sched-label">봄</span></h2>
        <button type="button" class="btn-text" data-go="hub">닫기</button>
      </div>
      <p id="sched-hint" class="panel-desc">이번 계절 활동 3칸을 채워 주세요.</p>
      <div id="slot-row" class="slot-row"></div>
      <div id="fest-box" class="fest-box hidden">
        <p class="fest-title">가을 축제 — 참가할 행사를 고르세요</p>
        <div id="fest-choices" class="fest-choices"></div>
      </div>
      <div id="cat-tabs" class="cat-tabs"></div>
      <div id="act-list" class="act-list"></div>
      <button id="btn-run-month" type="button" class="btn-primary" disabled>계절 진행</button>
    </div>
  </section>

  <!-- Event / result VN -->
  <section id="screen-event" class="screen screen-game hidden">
    <div id="scene-bg" class="scene-bg">
      <img id="scene-bg-img" class="scene-bg-img" alt="">
      <div class="scene-veil" aria-hidden="true"></div>
    </div>
    <div class="story-stage">
      <div class="portrait-wrap">
        <div class="portrait-frame">
          <img id="portrait-img" class="portrait-img" alt="">
        </div>
      </div>
      <div class="dialog-box" id="dialog-box">
        <p class="speaker-name" id="speaker-name">아라</p>
        <p class="dialog-text" id="dialog-text"></p>
        <span class="tap-hint" id="tap-hint" aria-hidden="true">▾</span>
      </div>
      <div class="choices" id="choices" aria-live="polite"></div>
    </div>
  </section>

  <!-- Ending -->
  <section id="screen-ending" class="screen screen-ending hidden">
    <div id="ending-bg" class="scene-bg">
      <img id="ending-bg-img" class="scene-bg-img" alt="">
      <div class="scene-veil" aria-hidden="true"></div>
    </div>
    <div class="ending-card">
      <p class="ending-eyebrow">엔딩</p>
      <h2 class="ending-title" id="ending-title">제목</h2>
      <p class="ending-text" id="ending-text">설명</p>
      <div class="ending-flags" id="ending-flags"></div>
      <button id="btn-ending-title" type="button" class="btn-primary">타이틀로</button>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script src="../assets/sfx-bank.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="events.js"></script>
<script src="game.js"></script>
</body>
</html>
