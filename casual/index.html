<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>캐주얼 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hub.css">
</head>
<body>
<main class="hub">
  <header class="hub-header">
    <p class="hub-eyebrow">tainery games</p>
    <h1>캐주얼 게임</h1>
    <p class="hub-sub">플레이할 게임을 선택하세요</p>
  </header>

  <nav class="game-grid" aria-label="게임 목록">
    <a class="game-card" href="tetris/">
      <span class="game-icon" aria-hidden="true">🍬</span>
      <span class="game-title">파스텔 테트리스</span>
      <span class="game-desc">블록을 쌓고 라인을 지워요</span>
    </a>
    <a class="game-card" href="bubble/">
      <span class="game-icon" aria-hidden="true">🫧</span>
      <span class="game-title">버블슈터</span>
      <span class="game-desc">같은 색 3개를 터뜨려요</span>
    </a>
  </nav>
</main>
</body>
</html>
