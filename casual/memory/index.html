<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1a2b">
<title>포켓몬 메모리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../assets/no-select.css">
<script src="../assets/mobile-hardening.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="back-btn" href="../" aria-label="목록으로">목록</a>
    <h1 class="title">포켓몬 메모리</h1>
    <div class="top-actions">
      <button id="btn-help" class="icon-btn" type="button" aria-label="게임 설명서" title="설명서">?</button>
      <button id="btn-sound" class="icon-btn" type="button" aria-label="소리">
        <svg class="ico-on" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
          <path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="ico-off" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
          <path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="stat-bar">
    <span class="chip"><span class="chip-label">이동</span><span id="moves">0</span></span>
    <span class="chip"><span class="chip-label">시간</span><span id="timer">00:00</span></span>
    <span class="chip"><span class="chip-label">최고</span><span id="best">–</span></span>
    <div class="mode-toggle" role="group" aria-label="난이도 선택">
      <button type="button" class="mode-btn is-active" id="btn-normal" data-mode="normal">보통</button>
      <button type="button" class="mode-btn" id="btn-hard" data-mode="hard">어려움</button>
    </div>
    <button type="button" class="icon-btn new-btn" id="btn-new" aria-label="새 게임" title="새 게임">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 12a8 8 0 0113.66-5.66M20 12a8 8 0 01-13.66 5.66" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M17 4v4h-4M7 20v-4h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <main class="stage">
    <div id="board" class="board" data-mode="normal" aria-live="polite"></div>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-card" id="overlay-card"></div>
  </div>

  <div id="help-overlay" class="overlay help-overlay" hidden>
    <div class="overlay-card help-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <h2 id="help-title">게임 설명서</h2>
      <p class="help-lead">카드를 두 장씩 뒤집어 <strong>같은 포켓몬</strong>을 찾아보세요!</p>

      <section class="help-ex">
        <div class="help-badge">📇 카드 뒤집기</div>
        <p class="help-note">카드를 탭하면 뒤집혀요. 두 장을 뒤집으면 결과를 확인해요.</p>
      </section>

      <section class="help-ex help-ex-ok">
        <div class="help-badge">✨ 짝이 맞으면</div>
        <p class="help-note">두 카드가 같은 포켓몬이면 반짝이며 그대로 앞면으로 남아요.</p>
      </section>

      <section class="help-ex help-ex-bad">
        <div class="help-badge">↩️ 짝이 다르면</div>
        <p class="help-note">잠시 뒤 두 카드가 다시 뒷면으로 돌아가요. 위치를 잘 기억해두세요!</p>
      </section>

      <section class="help-ex">
        <div class="help-badge">🏆 점수</div>
        <p class="help-note">모든 짝을 맞추면 완료! 이동 횟수가 적을수록 좋아요. 최고 기록은 자동으로 저장돼요.</p>
      </section>

      <p class="help-tip">어려움 모드는 4×4(8쌍)로 훨씬 더 어려워요.</p>
      <button type="button" class="retry" id="btn-help-close">알겠어요</button>
    </div>
  </div>
</div>
<script src="../assets/sfx-bank.js"></script>
<script src="game.js"></script>
</body>
</html>
