<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gem Crush - GemGem</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body>
    <div class="language-selector">
        <button class="lang-btn" data-lang="en" onclick="i18n.setLanguage('en')">EN</button>
        <button class="lang-btn" data-lang="ko" onclick="i18n.setLanguage('ko')">한국어</button>
    </div>
    
    <a href="../../" class="back-link" data-i18n="game.back">← Menu</a>
    
    <div class="game-container">
        <div class="game-header">
            <h1><span>💎</span> <span data-i18n="theme.gems.title">Gem Crush</span></h1>
            <div class="game-info">
                <div class="timer-display">⏱️ <span id="timer">5:00</span></div>
                <div class="score-display"><span data-i18n="game.score">Score</span>: <span id="score">0</span></div>
            </div>
        </div>
        
        <div class="game-board">
            <canvas id="gameCanvas"></canvas>
        </div>
        
        <div class="game-controls">
            <button class="btn btn-primary" onclick="game.reset()" data-i18n="game.restart">Restart</button>
            <button class="btn btn-sound" id="soundBtn" onclick="toggleSound()">🔊</button>
        </div>
        
        <div class="combo-display"></div>
    </div>
    
    <script src="../js/i18n.js"></script>
    <script src="../js/core/Tile.js"></script>
    <script src="../js/core/Grid.js"></script>
    <script src="../js/core/Matcher.js"></script>
    <script src="../js/core/Animator.js"></script>
    <script src="../js/core/SoundManager.js"></script>
    <script src="../js/core/Game.js"></script>
    
    <script>
        let game;
        
        window.onload = function() {
            game = new Game('gameCanvas', 'gems');
            game.start();
        };
        
        function toggleSound() {
            const enabled = game.toggleSound();
            document.getElementById('soundBtn').textContent = enabled ? '🔊' : '🔇';
        }
    </script>
</body>
</html>
