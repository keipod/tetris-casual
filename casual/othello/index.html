<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c1828">
<title>오셀로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/school-shell.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../assets/no-select.css">
<script src="../assets/mobile-hardening.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="back-btn" href="../" aria-label="목록으로">목록</a>
    <h1 class="title">오셀로</h1>
    <div class="top-actions">
      <button id="btn-help" class="icon-btn" type="button" aria-label="게임 설명서">?</button>
      <button id="btn-sound" class="icon-btn" type="button" aria-label="소리">
        <svg class="ico-on" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="ico-off" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-new" class="icon-btn" type="button" aria-label="새 게임">↻</button>
    </div>
  </header>
  <div class="stat-bar">
    <span class="chip"><span class="chip-label">⚫ 나</span><span id="score-b">2</span></span>
    <span class="chip"><span class="chip-label">⚪ AI</span><span id="score-w">2</span></span>
    <span class="chip"><span class="chip-label">연속승</span><span id="streak">0</span></span>
    <span class="chip"><span class="chip-label">최고</span><span id="best">0</span></span>
  </div>
  <main class="stage">
    <div id="board" class="board" aria-label="오셀로 판"></div>
    <p class="turn-hint" id="hint">당신 차례 · 검은 돌</p>
  </main>
  <div id="overlay" class="overlay" hidden>
    <div class="overlay-card" id="overlay-card"></div>
  </div>
  <div id="help-overlay" class="overlay" hidden>
    <div class="overlay-card help-card" role="dialog" aria-modal="true">
      <h2>게임 설명서</h2>
      <p class="help-lead">상대 돌을 <strong>끼워</strong> 내 색으로 뒤집어요!</p>
      <section class="help-ex"><div class="help-badge">⚫ 검은 돌 = 나</div><p class="help-note">점 표시가 있는 칸에만 둘 수 있어요. 사이에 끼인 흰 돌이 모두 검게 바뀝니다.</p></section>
      <section class="help-ex"><div class="help-badge">🤖 AI</div><p class="help-note">내가 두면 AI가 흰 돌로 응수합니다. 둘 곳이 없으면 패스됩니다.</p></section>
      <section class="help-ex"><div class="help-badge">🏆 승리</div><p class="help-note">판이 가득 차거나 양쪽 모두 둘 곳이 없으면, 돌이 더 많은 쪽이 이깁니다.</p></section>
      <button type="button" class="retry" id="btn-help-close">알겠어요</button>
    </div>
  </div>
</div>
<script src="../assets/sfx-bank.js"></script>
<script src="game.js"></script>
</body>
</html>
