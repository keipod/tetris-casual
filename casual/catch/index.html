<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3d6b2e">
<title>포켓몬 잡기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@500;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="back-btn" href="../" aria-label="목록으로">목록</a>
    <div class="score-bar">
      <span class="chip"><span class="chip-label">도감</span><span id="dex-count">0/0</span></span>
    </div>
    <button id="btn-dex" class="icon-btn" type="button" aria-label="도감">도감</button>
    <button id="btn-sound" class="icon-btn" type="button" aria-label="소리">
      <svg class="ico-on" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
        <path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg class="ico-off" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
        <path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <main class="stage-wrap">
    <div class="meadow-bg" aria-hidden="true">
      <div class="meadow-sky"></div>
      <div class="meadow-cloud meadow-cloud-a"></div>
      <div class="meadow-cloud meadow-cloud-b"></div>
      <div class="meadow-hill meadow-hill-far"></div>
      <div class="meadow-hill meadow-hill-near"></div>
      <div class="meadow-grass"></div>
      <div class="meadow-flowers"></div>
    </div>
    <div class="terrain terrain-left" aria-hidden="true"></div>
    <div class="terrain terrain-right" aria-hidden="true"></div>
    <div id="roamers" class="roamers"></div>
    <canvas id="game-canvas"></canvas>
    <div id="catch-toast" class="catch-toast" hidden></div>

    <div id="card-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="card-name">
      <div class="card-stage">
        <div id="dex-card" class="dex-card"></div>
        <button id="btn-card-close" class="btn" type="button">계속 잡기</button>
      </div>
    </div>

    <div id="dex-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="도감">
      <div class="dex-panel">
        <header class="dex-panel-head">
          <h2>도감</h2>
          <p id="dex-empty" class="dex-empty hidden">아직 잡은 포켓몬이 없어요. 초원에서 볼을 던져 보세요.</p>
        </header>
        <div id="dex-grid" class="dex-grid"></div>
        <button id="btn-dex-close" class="btn" type="button">닫기</button>
      </div>
    </div>
  </main>

  <footer class="hint">하단에서 당겼다 놓으면 몬스터볼이 날아갑니다</footer>
</div>
<script src="game.js"></script>
</body>
</html>
