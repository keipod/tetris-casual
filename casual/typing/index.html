<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c1828">
<title>타이핑 러시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/school-shell.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../assets/no-select.css">
<script src="../assets/mobile-hardening.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="back-btn" href="../">목록</a>
    <h1 class="title">타이핑 러시</h1>
    <div class="top-actions">
      <button id="btn-help" class="icon-btn" type="button">?</button>
      <button id="btn-sound" class="icon-btn" type="button" aria-label="소리">
        <svg class="ico-on" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="ico-off" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>
  <div class="stat-bar">
    <span class="chip"><span class="chip-label">점수</span><span id="score">0</span></span>
    <span class="chip"><span class="chip-label">콤보</span><span id="combo">0</span></span>
    <span class="chip"><span class="chip-label">생명</span><span id="lives">3</span></span>
    <span class="chip"><span class="chip-label">최고</span><span id="best">0</span></span>
  </div>
  <main class="stage">
    <div id="sky" class="sky" aria-live="polite"></div>
    <div class="input-row">
      <input id="type-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="단어를 입력하세요" enterkeyhint="done">
      <button type="button" class="action-btn" id="btn-start">시작</button>
    </div>
  </main>
  <div id="overlay" class="overlay" hidden><div class="overlay-card" id="overlay-card"></div></div>
  <div id="help-overlay" class="overlay" hidden>
    <div class="overlay-card help-card">
      <h2>게임 설명서</h2>
      <p class="help-lead">떨어지는 단어를 <strong>정확히 입력</strong>해 지우세요!</p>
      <section class="help-ex"><div class="help-badge">⌨️ 입력</div><p class="help-note">입력창에 단어를 치고 Enter(또는 완료)하면 사라집니다. 바닥에 닿으면 생명이 줄어요.</p></section>
      <button type="button" class="retry" id="btn-help-close">알겠어요</button>
    </div>
  </div>
</div>
<script src="../assets/sfx-bank.js"></script>
<script src="game.js"></script>
</body>
</html>
