<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101d2e">
<title>플래피 대시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../assets/no-select.css">
<script src="../assets/mobile-hardening.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="back-btn" href="../" aria-label="목록으로">목록</a>
    <h1 class="title">플래피 대시</h1>
    <div class="top-actions">
      <button id="btn-help" class="icon-btn" type="button" aria-label="게임 설명서" title="설명서">?</button>
      <button id="btn-sound" class="icon-btn" type="button" aria-label="소리">
        <svg class="ico-on" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
          <path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="ico-off" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
          <path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <div class="canvas-box" id="canvas-box">
      <div class="game-frame">
        <canvas id="game" width="360" height="640" aria-label="플래피 대시 게임 화면"></canvas>
        <button id="btn-pause" class="hud-btn" type="button" aria-label="일시정지">
          <svg class="ico-pause" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="6" y="4" width="4" height="16" rx="1.4" fill="currentColor"/>
            <rect x="14" y="4" width="4" height="16" rx="1.4" fill="currentColor"/>
          </svg>
          <svg class="ico-play" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 5.5v13l11-6.5-11-6.5z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-card" id="overlay-card"></div>
  </div>

  <div id="help-overlay" class="overlay help-overlay" hidden>
    <div class="overlay-card help-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <h2 id="help-title">게임 설명서</h2>
      <p class="help-lead">탭 한 번으로 병아리를 날려 <strong>파이프 사이</strong>를 통과하세요!</p>

      <section class="help-ex">
        <div class="help-badge">👆 조작 방법</div>
        <p class="help-note">화면을 탭하거나 스페이스/↑ 키를 누르면 위로 쏙! 날개짓 한 번에 살짝 올라가요.</p>
      </section>

      <section class="help-ex help-ex-ok">
        <div class="help-badge">🎯 점수</div>
        <p class="help-note">파이프 한 개를 통과할 때마다 1점! 계속 나아갈수록 속도가 붙고 틈이 좁아져요.</p>
      </section>

      <section class="help-ex help-ex-bad">
        <div class="help-badge">💥 아웃 조건</div>
        <p class="help-note">파이프나 땅에 부딪히면 게임 끝! 천장은 닿아도 괜찮아요.</p>
      </section>

      <section class="help-ex">
        <div class="help-badge">🏅 메달</div>
        <p class="help-note">🥉 10점 · 🥈 25점 · 🥇 50점 · 💎 100점! 최고 기록은 자동으로 저장돼요.</p>
      </section>

      <p class="help-tip">잠깐 쉬고 싶으면 오른쪽 위 ⏸ 버튼!</p>
      <button type="button" class="retry" id="btn-help-close">알겠어요</button>
    </div>
  </div>
</div>
<script src="../assets/sfx-bank.js"></script>
<script src="game.js"></script>
</body>
</html>
