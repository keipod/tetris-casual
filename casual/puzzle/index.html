<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2d4a6e">
<title>퍼즐 맞추기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="back-btn" href="../" aria-label="목록으로">목록</a>
    <div class="score-bar">
      <span class="chip"><span class="chip-label">이동</span><span id="moves">0</span></span>
      <span class="chip"><span class="chip-label">시간</span><span id="timer">0:00</span></span>
      <span class="chip"><span class="chip-label">최고</span><span id="best">—</span></span>
    </div>
    <button id="btn-sound" class="icon-btn" type="button" aria-label="소리">
      <svg class="ico-on" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
        <path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg class="ico-off" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
        <path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <div class="controls">
    <div class="size-toggle" role="group" aria-label="난이도">
      <button type="button" class="size-btn active" data-size="3">3×3</button>
      <button type="button" class="size-btn" data-size="4">4×4</button>
    </div>
    <button id="btn-new" class="btn-ghost" type="button">새 포켓몬</button>
  </div>

  <main class="stage">
    <div class="board-wrap">
      <div id="board" class="board" aria-label="슬라이딩 퍼즐"></div>
      <div id="minimap" class="minimap" aria-hidden="true">
        <img id="minimap-img" alt="" />
      </div>
    </div>
    <p id="hint" class="hint">타일을 빈칸 쪽으로 밀어 맞춰 보세요</p>
  </main>

  <div id="preview-overlay" class="overlay" hidden>
    <div class="preview-card">
      <img id="preview-img" alt="" />
      <p id="preview-name" class="preview-name"></p>
      <p class="preview-countdown"><span id="preview-sec">3</span></p>
    </div>
  </div>

  <div id="win-overlay" class="overlay win" hidden>
    <div class="win-card">
      <div id="win-art-wrap" class="win-art-wrap">
        <img id="win-img" alt="" />
      </div>
      <h2 id="win-name" class="win-name"></h2>
      <p id="win-stats" class="win-stats"></p>
      <div class="win-actions">
        <button id="btn-replay" class="btn" type="button">다시 하기</button>
        <button id="btn-next" class="btn btn-accent" type="button">다음 포켓몬</button>
      </div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
