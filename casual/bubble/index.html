<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5FAF4A">
<title>버블슈터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="back-btn" href="../" aria-label="목록으로">목록</a>
    <div class="score-bar">
      <span class="chip"><span class="chip-label">점수</span><span id="score">0</span></span>
      <span class="chip"><span class="chip-label">최고</span><span id="best">0</span></span>
      <span class="chip"><span class="chip-label">콤보</span><span id="combo">0</span></span>
    </div>
    <button id="btn-sound" class="icon-btn" type="button" aria-label="소리">
      <svg class="ico-on" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
        <path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg class="ico-off" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
        <path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <main class="stage-wrap">
    <div class="meadow-bg" aria-hidden="true">
      <div class="meadow-sky"></div>
      <div class="meadow-cloud meadow-cloud-a"></div>
      <div class="meadow-cloud meadow-cloud-b"></div>
      <div class="meadow-hill meadow-hill-far"></div>
      <div class="meadow-hill meadow-hill-near"></div>
      <div class="meadow-grass"></div>
      <div class="meadow-flowers"></div>
    </div>
    <div class="pressure-wrap">
      <div class="pressure-track"><div id="pressure-bar" class="pressure-fill"></div></div>
    </div>
    <div class="terrain terrain-left" aria-hidden="true"></div>
    <div class="terrain terrain-right" aria-hidden="true"></div>
    <div id="roamers" class="roamers" aria-hidden="true"></div>
    <img id="slingshot-pokemon" class="slingshot-pokemon" alt="" hidden />
    <canvas id="game-canvas"></canvas>
    <div id="combo-toast" class="combo-toast" hidden></div>
    <div id="overlay" class="overlay">
      <div class="overlay-card" id="overlay-card"></div>
    </div>
  </main>

  <footer class="hint">아래로 당겼다 놓으면 발사 · 벽에서 튕깁니다</footer>
</div>
<script src="game.js"></script>
</body>
</html>
