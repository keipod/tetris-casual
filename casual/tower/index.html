<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8FBF7A">
<title>타워 디펜스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="back-btn" href="../" aria-label="목록으로">목록</a>
    <h1 class="title">Keepwatch</h1>
    <div class="top-actions">
      <button id="btn-pause" class="icon-btn" type="button" aria-label="일시정지">Ⅱ</button>
      <button id="btn-speed" class="icon-btn" type="button" aria-label="배속">1×</button>
      <button id="btn-sound" class="icon-btn" type="button" aria-label="소리">
        <svg class="ico-on" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
          <path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="ico-off" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor"/>
          <path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="stage-wrap">
    <canvas id="game-canvas"></canvas>
    <p id="banner" class="banner" hidden></p>
  </main>

  <footer class="dock">
    <div class="status">
      <span class="chip"><span class="chip-label">금화</span><span id="gold">0</span></span>
      <span class="chip"><span class="chip-label">웨이브</span><span id="wave">0/10</span></span>
      <span class="chip"><span class="chip-label">기지</span><span id="hp">20</span></span>
    </div>
    <div class="build-row" role="group" aria-label="타워 선택">
      <button type="button" class="tower-btn" data-kind="arrow" aria-pressed="false">
        <img src="assets/tower-arrow.png" alt="">
        <span>화살 50</span>
      </button>
      <button type="button" class="tower-btn" data-kind="magic" aria-pressed="false">
        <img src="assets/tower-magic.png" alt="">
        <span>마법 70</span>
      </button>
      <button type="button" class="tower-btn" data-kind="cannon" aria-pressed="false">
        <img src="assets/tower-cannon.png" alt="">
        <span>대포 90</span>
      </button>
    </div>
  </footer>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-card">
      <h2 id="sheet-title">타워</h2>
      <p id="sheet-body"></p>
      <div class="sheet-actions">
        <button type="button" id="btn-upgrade" class="btn">강화</button>
        <button type="button" id="btn-sell" class="btn ghost">판매</button>
        <button type="button" id="btn-sheet-close" class="btn ghost">닫기</button>
      </div>
    </div>
  </div>

  <div id="overlay" class="overlay">
    <div class="overlay-card" id="overlay-card"></div>
  </div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
